[project]
name = "content-studio-fte"
version = "0.1.0"
description = "A Digital FTE content worker: one agent whose method is folder-based skills read from a sandbox, a purpose-built MCP server, Neon Postgres + pgvector, an audit trail you can replay, and an approval gate on every write."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = [
    "openai-agents",
    "mcp",
    "model-context-protocol",
    "digital-fte",
    "pgvector",
    "neon",
    "agent-skills",
    "rag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "arize-phoenix-client>=3.3.0",
    "arize-phoenix-evals>=3.5.1",
    "asyncpg>=0.31.0",
    "azure-monitor-opentelemetry>=1.8.9",
    "fastapi>=0.116.0",
    "mcp>=2.0.0",
    # `e2b` is not optional here despite being an extra: since 2026-08-27 the
    # method is read from files inside a sandbox, so an image built without it
    # ships an agent that cannot reach its own method.
    "openai-agents[sqlalchemy,e2b]>=0.20.0",
    "openinference-instrumentation-openai-agents>=2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.43.0",
    "opentelemetry-instrumentation-asyncpg>=0.64b0",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-instrumentation-httpx>=0.64b0",
    "pgvector>=0.5.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.0",
]

[project.urls]
Repository = "https://github.com/sorinLupaIonut/content-studio-fte"
Documentation = "https://github.com/sorinLupaIonut/content-studio-fte/blob/main/docs/manual.html"

[project.scripts]
content-studio-harness = "content_studio.harness.main:run"
content-studio-server = "content_studio.mcp_server.server:main"

[dependency-groups]
# `debugpy` so a process the editor did not launch can still be attached to:
# a service left running in a terminal, or one inside a container. See
# `src/content_studio/debug.py`.
dev = [
    "debugpy>=1.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_studio"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["content"]

[tool.ruff.lint]
# E/F  pycodestyle + pyflakes, the usual floor
# I    import order, so diffs stay small
# UP   modern syntax for the Python this project requires
# B    bugbear: the mistakes that survive review
# RET  for one rule in it: RET502, the bare `return` in a function that returns
#      a value elsewhere. On 2026-08-31 one on the success path of
#      `_generate_one_detail() -> bool` made eight developed ideas each record a
#      FAILED run - the content was fine, the log said the opposite. Nothing
#      else in the repository trips these, so it costs nothing to keep.
#      Its autofix is WRONG for that shape - it writes `return None`, which
#      keeps the bug - so never `--fix` this one blind. The rule earns its place
#      by asking the question, not by answering it.
select = ["E", "F", "I", "UP", "B", "RET"]

[tool.ruff.lint.per-file-ignores]
# The check scripts print wide report lines on purpose; wrapping them would make
# the output harder to read than the source.
"tests/checks/*.py" = ["E501"]
