[project]
name = "content-studio-fte"
version = "0.1.0"
description = "A Digital FTE content worker: one agent with folder-based skills as tools, a purpose-built MCP server, Neon Postgres + pgvector, an audit trail you can replay, and an approval gate on every write."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = [
    "openai-agents",
    "mcp",
    "model-context-protocol",
    "digital-fte",
    "pgvector",
    "neon",
    "agent-skills",
    "rag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "asyncpg>=0.31.0",
    "azure-monitor-opentelemetry>=1.8.9",
    "fastapi>=0.116.0",
    "mcp>=2.0.0",
    "openai-agents[sqlalchemy]>=0.20.0",
    "openinference-instrumentation-openai-agents>=2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.43.0",
    "opentelemetry-instrumentation-asyncpg>=0.64b0",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-instrumentation-httpx>=0.64b0",
    "pgvector>=0.5.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.0",
]

[project.urls]
Repository = "https://github.com/sorinLupaIonut/content-studio-fte"
Documentation = "https://github.com/sorinLupaIonut/content-studio-fte/blob/main/docs/manual.html"

[project.scripts]
content-studio-harness = "content_studio.harness.main:run"
content-studio-server = "content_studio.mcp_server.server:main"

[project.optional-dependencies]
evals = [
    "deepeval>=4.2.0",
]

[dependency-groups]
# `debugpy` so a process the editor did not launch can still be attached to:
# a service left running in a terminal, or one inside a container. See
# `src/content_studio/debug.py`.
dev = ["debugpy>=1.8.0", "ruff>=0.14.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_studio"]

[tool.pytest.ini_options]
# `evals` is a directory of scripts, not an installed package, and pytest would
# otherwise put `evals/output` itself on the path - making the module `output`
# and `from evals.output... ` unimportable. The repo root on the path is the
# same thing `python -m unittest discover` gets for free from the cwd.
pythonpath = ["."]
testpaths = ["evals/output"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["content"]

[tool.ruff.lint]
# E/F  pycodestyle + pyflakes, the usual floor
# I    import order, so diffs stay small
# UP   modern syntax for the Python this project requires
# B    bugbear: the mistakes that survive review
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The check scripts print wide report lines on purpose; wrapping them would make
# the output harder to read than the source.
"tests/checks/*.py" = ["E501"]
