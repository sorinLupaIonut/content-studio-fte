<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780"
     font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="t2 d2">
  <title id="t2">The stack that runs in production, and the three places it diverges</title>
  <desc id="d2">The browser reaches an Azure Container Apps ingress fronting the FastAPI harness. The harness builds one SandboxAgent per run, opens one E2B container for the method files, and reaches all business data through a second, internal-only container app running the MCP server, which is the only component that touches Neon Postgres. Below, the two components of the reference stack that are absent here, each with its reason.</desc>

  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E7C68"/>
    </marker>
    <marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3A5BB8"/>
    </marker>
    <marker id="b3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C2751F"/>
    </marker>
    <marker id="b4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA8A2"/>
    </marker>
  </defs>

  <rect width="1000" height="780" fill="#FBFAF7"/>

  <text x="40" y="48" font-size="25" font-weight="700" fill="#1A2420">The deployed stack, and the three divergences</text>
  <text x="40" y="75" font-size="14" fill="#6B7A74">Same control-plane / execution-plane split as the reference. Three differences, each a decision.</text>

  <!-- browser -->
  <rect x="330" y="104" width="340" height="54" rx="6" fill="#FFFFFF" stroke="#DFE3DC" stroke-width="1.5"/>
  <text x="500" y="128" font-size="15" font-weight="600" fill="#1A2420" text-anchor="middle">Browser · Blazor WebAssembly</text>
  <text x="500" y="147" font-size="12" fill="#6B7A74" text-anchor="middle">buttons and chat — ONE conversation</text>
  <path d="M500,158 L500,192" stroke="#3A5BB8" stroke-width="2.5" fill="none" marker-end="url(#b2)"/>
  <text x="514" y="182" font-size="12" fill="#3A5BB8">HTTPS · Easy Auth</text>

  <!-- azure boundary -->
  <rect x="30" y="196" width="580" height="356" rx="8" fill="#E1E8FA" stroke="#3A5BB8" stroke-width="1.5" stroke-dasharray="8 5" opacity="0.5"/>
  <text x="48" y="220" font-size="11" font-weight="700" fill="#2A4590" letter-spacing="1.4">AZURE CONTAINER APPS · SCALE-TO-ZERO</text>

  <!-- harness -->
  <rect x="50" y="234" width="380" height="134" rx="6" fill="#FFFFFF" stroke="#3A5BB8" stroke-width="2.5"/>
  <text x="70" y="260" font-size="16" font-weight="700" fill="#2A4590">FastAPI harness</text>
  <text x="70" y="280" font-size="11.5" fill="#5C6B66">the control plane · 1 vCPU · 2 GiB · min 0 / max 1</text>
  <text x="70" y="306" font-size="12.5" fill="#1A2420">Holds every root credential —</text>
  <text x="70" y="326" font-size="12.5" fill="#1A2420">none of them ever leaves here.</text>
  <text x="70" y="352" font-size="12.5" fill="#1A2420">Owns the run lifecycle and the gate.</text>

  <!-- mcp app -->
  <rect x="50" y="392" width="380" height="112" rx="6" fill="#FBEBD6" stroke="#C2751F" stroke-width="2.5"/>
  <text x="70" y="416" font-size="10.5" font-weight="700" fill="#C2751F" letter-spacing="1.3">DIVERGENCE 1 · NOT IN THE REFERENCE</text>
  <text x="70" y="440" font-size="16" font-weight="700" fill="#8A5415">content-data</text>
  <text x="70" y="460" font-size="11.5" fill="#5C6B66">the MCP data plane · 0.5 vCPU · 1 GiB</text>
  <text x="70" y="482" font-size="12.5" fill="#1A2420">INTERNAL ingress — not on the internet.</text>
  <text x="70" y="500" font-size="12.5" fill="#1A2420">10 model tools, 25 internal. No run_sql.</text>
  <path d="M240,368 L240,388" stroke="#C2751F" stroke-width="2.5" fill="none"/>
  <text x="252" y="384" font-size="12" font-weight="600" fill="#C2751F">MCP over HTTP</text>

  <!-- observability -->
  <rect x="50" y="516" width="380" height="30" rx="5" fill="#FFFFFF" stroke="#DFE3DC" stroke-width="1.5"/>
  <text x="70" y="536" font-size="11.5" fill="#5C6B66">App Insights · 100% sampled · one run_id</text>

  <!-- e2b -->
  <rect x="650" y="234" width="310" height="134" rx="6" fill="#FFFFFF" stroke="#0E7C68" stroke-width="2.5"/>
  <text x="670" y="260" font-size="16" font-weight="700" fill="#0E5A4C">E2B container</text>
  <text x="670" y="280" font-size="11.5" fill="#5C6B66">one per run · up in ~1s, gone in 0.25s</text>
  <text x="670" y="306" font-size="12.5" fill="#1A2420">ZERO credentials. No network.</text>
  <text x="670" y="330" font-size="11.5" fill="#0E7C68">.agents/propune-postari/</text>
  <text x="670" y="350" font-size="11.5" fill="#0E7C68">.agents/dezvolta-postarea/</text>

  <!-- neon -->
  <rect x="650" y="392" width="310" height="112" rx="6" fill="#FFFFFF" stroke="#3A5BB8" stroke-width="2.5"/>
  <text x="670" y="418" font-size="16" font-weight="700" fill="#2A4590">Neon Postgres</text>
  <text x="670" y="438" font-size="11.5" fill="#5C6B66">+ pgvector · pooled app, direct migrations</text>
  <text x="670" y="462" font-size="12.5" fill="#1A2420">16 tables · 4,778 embedded chunks</text>
  <text x="670" y="486" font-size="12.5" fill="#1A2420">Write + audit row: ONE transaction.</text>

  <!-- phoenix -->
  <rect x="650" y="516" width="310" height="30" rx="5" fill="#FFFFFF" stroke="#DFE3DC" stroke-width="1.5"/>
  <text x="670" y="536" font-size="11.5" fill="#5C6B66">Arize Phoenix — Neon is the record</text>

  <!-- arrows across the gap, labels centred in it -->
  <path d="M434,290 L644,290" stroke="#0E7C68" stroke-width="2.5" fill="none" marker-end="url(#b1)"/>
  <text x="539" y="281" font-size="12" font-weight="600" fill="#0E7C68" text-anchor="middle">shell — reads the method</text>

  <path d="M434,448 L644,448" stroke="#C2751F" stroke-width="2.5" fill="none" marker-end="url(#b3)"/>
  <text x="539" y="439" font-size="12" font-weight="600" fill="#C2751F" text-anchor="middle">the only path to the data</text>

  <path d="M434,531 L644,531" stroke="#9AA8A2" stroke-width="1.2" stroke-dasharray="5 4" fill="none" marker-end="url(#b4)"/>

  <!-- ===== the missing band ===== -->
  <rect x="30" y="580" width="930" height="168" rx="8" fill="#FFFFFF" stroke="#C0304A" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="52" y="606" font-size="11" font-weight="700" fill="#C0304A" letter-spacing="1.4">IN THE REFERENCE STACK, ABSENT HERE — EACH ONE A DECISION</text>

  <text x="52" y="636" font-size="10.5" font-weight="700" fill="#C0304A" letter-spacing="1.2">DIVERGENCE 2</text>
  <text x="52" y="660" font-size="15" font-weight="600" fill="#1A2420">Cloudflare Sandbox + bridge Worker</text>
  <text x="52" y="686" font-size="12.5" fill="#5C6B66">The reference routes Python clients through a Worker</text>
  <text x="52" y="706" font-size="12.5" fill="#5C6B66">that exposes the Sandbox API over HTTP. E2B needs no</text>
  <text x="52" y="726" font-size="12.5" fill="#5C6B66">bridge: one fewer boundary to authenticate.</text>

  <text x="530" y="636" font-size="10.5" font-weight="700" fill="#C0304A" letter-spacing="1.2">DIVERGENCE 3</text>
  <text x="530" y="660" font-size="15" font-weight="600" fill="#1A2420">Cloudflare R2</text>
  <text x="530" y="686" font-size="12.5" fill="#5C6B66">Refused outright, not postponed — her posts are domain</text>
  <text x="530" y="706" font-size="12.5" fill="#5C6B66">rows, not files. /health reports artifacts inactive WITH</text>
  <text x="530" y="726" font-size="12.5" fill="#5C6B66">the reason, so the refusal is visible in the system.</text>
</svg>
