<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660"
     font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="t1 d1">
  <title id="t1">The architecture chosen: one agent, with the plan handed to it as a folder</title>
  <desc id="d1">The five questions of the architecture decision tree, each answered for this project. Q1 to Q3 lead to a single agent with ReAct and tools. Q4 and Q5 are additive layers, both declined, each with the measurement that declined it. Two branches not taken are shown with the reason.</desc>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E7C68"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA8A2"/>
    </marker>
  </defs>

  <rect width="1000" height="660" fill="#FBFAF7"/>

  <text x="40" y="46" font-size="24" font-weight="700" fill="#1A2420">How the architecture was chosen</text>
  <text x="40" y="72" font-size="14" fill="#6B7A74">Five questions. Three pick the core pattern; two are layers you add on top — both declined here.</text>

  <!-- ===== left column: the three core questions ===== -->
  <rect x="40" y="100" width="400" height="62" rx="6" fill="#FFFFFF" stroke="#DFE3DC" stroke-width="1.5"/>
  <text x="60" y="124" font-size="11" font-weight="700" fill="#9AA8A2" letter-spacing="1.5">Q1</text>
  <text x="60" y="146" font-size="15" font-weight="600" fill="#1A2420">Can the solution path be defined in advance?</text>
  <path d="M240,162 L240,192" stroke="#0E7C68" stroke-width="2.5" fill="none" marker-end="url(#a1)"/>
  <text x="254" y="182" font-size="12.5" font-weight="600" fill="#0E7C68">partly — phases yes, steps no</text>

  <rect x="40" y="196" width="400" height="62" rx="6" fill="#FFFFFF" stroke="#DFE3DC" stroke-width="1.5"/>
  <text x="60" y="220" font-size="11" font-weight="700" fill="#9AA8A2" letter-spacing="1.5">Q2</text>
  <text x="60" y="242" font-size="15" font-weight="600" fill="#1A2420">Is the workflow fixed across every run?</text>
  <path d="M240,258 L240,288" stroke="#0E7C68" stroke-width="2.5" fill="none" marker-end="url(#a1)"/>
  <text x="254" y="278" font-size="12.5" font-weight="600" fill="#0E7C68">NO — the source picks the tools</text>

  <rect x="40" y="292" width="400" height="62" rx="6" fill="#FFFFFF" stroke="#DFE3DC" stroke-width="1.5"/>
  <text x="60" y="316" font-size="11" font-weight="700" fill="#9AA8A2" letter-spacing="1.5">Q3</text>
  <text x="60" y="338" font-size="15" font-weight="600" fill="#1A2420">Is the task structure articulable up front?</text>
  <path d="M240,354 L240,384" stroke="#0E7C68" stroke-width="2.5" fill="none" marker-end="url(#a1)"/>
  <text x="254" y="374" font-size="12.5" font-weight="600" fill="#0E7C68">YES — it is written in SKILL.md</text>

  <rect x="40" y="388" width="400" height="92" rx="6" fill="#DBF0EA" stroke="#0E7C68" stroke-width="2.5"/>
  <text x="60" y="414" font-size="11" font-weight="700" fill="#0E7C68" letter-spacing="1.5">THE CORE PATTERN</text>
  <text x="60" y="440" font-size="18" font-weight="700" fill="#0E5A4C">Single agent + ReAct + tools</text>
  <text x="60" y="459" font-size="13" fill="#2C5F55">The plan is a folder the domain expert edits herself —</text>
  <text x="60" y="476" font-size="13" fill="#2C5F55">an input to the run, not something a model re-derives.</text>

  <!-- ===== right column: the two additive layers ===== -->
  <rect x="480" y="100" width="480" height="140" rx="6" fill="#FFFFFF" stroke="#C2751F" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="502" y="126" font-size="11" font-weight="700" fill="#C2751F" letter-spacing="1.5">Q4 · ADDITIVE LAYER — DECLINED</text>
  <text x="502" y="150" font-size="15" font-weight="600" fill="#1A2420">A critique-and-refine pass?</text>
  <text x="502" y="176" font-size="13" fill="#5C6B66">What is genuinely checkable moved into the OUTPUT</text>
  <text x="502" y="194" font-size="13" fill="#5C6B66">SCHEMA, which the provider enforces WHILE the model</text>
  <text x="502" y="212" font-size="13" fill="#5C6B66">writes — so a structural rule costs no second call.</text>

  <rect x="480" y="252" width="480" height="58" rx="6" fill="#FBEBD6"/>
  <text x="502" y="274" font-size="12.5" fill="#8A5415">closest title pair · rule as prose, 3,800 tokens above</text>
  <text x="938" y="274" font-size="14" font-weight="700" fill="#8A5415" text-anchor="end">0.629</text>
  <text x="502" y="296" font-size="12.5" fill="#8A5415">closest title pair · ten archetypes as ten schema slots</text>
  <text x="938" y="296" font-size="14" font-weight="700" fill="#0E7C68" text-anchor="end">0.475</text>

  <rect x="480" y="330" width="480" height="140" rx="6" fill="#FFFFFF" stroke="#7A4FBF" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="502" y="356" font-size="11" font-weight="700" fill="#7A4FBF" letter-spacing="1.5">Q5 · ADDITIVE LAYER — DECLINED</text>
  <text x="502" y="380" font-size="15" font-weight="600" fill="#1A2420">A crew of specialist agents?</text>
  <text x="502" y="406" font-size="13" fill="#5C6B66">The two phases look like two specialists and are two</text>
  <text x="502" y="424" font-size="13" fill="#5C6B66">SKILLS instead: splitting them would copy the shared</text>
  <text x="502" y="442" font-size="13" fill="#5C6B66">context — her whole profile — into a second window.</text>

  <rect x="480" y="482" width="480" height="58" rx="6" fill="#EDE5FA"/>
  <text x="502" y="504" font-size="12.5" fill="#5B3A94">shared context a second agent would duplicate</text>
  <text x="938" y="504" font-size="14" font-weight="700" fill="#5B3A94" text-anchor="end">28,639 chars</text>
  <text x="502" y="526" font-size="12.5" fill="#5B3A94">cost multiplier, against 3 accounts and her own bill</text>
  <text x="938" y="526" font-size="14" font-weight="700" fill="#C0304A" text-anchor="end">5–20×</text>

  <path d="M444,131 L476,131" stroke="#9AA8A2" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a2)"/>
  <path d="M444,361 L476,361" stroke="#9AA8A2" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a2)"/>

  <!-- ===== branches not taken ===== -->
  <rect x="40" y="510" width="196" height="102" rx="6" fill="#FFFFFF" stroke="#DFE3DC" stroke-width="1.5"/>
  <text x="58" y="534" font-size="10.5" font-weight="700" fill="#9AA8A2" letter-spacing="1.2">NOT TAKEN · Q2 BRANCH</text>
  <text x="58" y="556" font-size="14" font-weight="600" fill="#6B7A74">Sequential workflow</text>
  <text x="58" y="578" font-size="11.5" fill="#8A968F">One form, four shapes: Memory</text>
  <text x="58" y="594" font-size="11.5" fill="#8A968F">calls no tool, Books one, Web</text>
  <text x="58" y="608" font-size="11.5" fill="#8A968F">another, Combined either or both.</text>

  <rect x="244" y="510" width="196" height="102" rx="6" fill="#FFFFFF" stroke="#DFE3DC" stroke-width="1.5"/>
  <text x="262" y="534" font-size="10.5" font-weight="700" fill="#9AA8A2" letter-spacing="1.2">NOT TAKEN · Q3 BRANCH</text>
  <text x="262" y="556" font-size="14" font-weight="600" fill="#6B7A74">Planning + ReAct</text>
  <text x="262" y="578" font-size="11.5" fill="#8A968F">It would pay a model, every</text>
  <text x="262" y="594" font-size="11.5" fill="#8A968F">run, to re-derive a plan that</text>
  <text x="262" y="608" font-size="11.5" fill="#8A968F">already exists as her prose.</text>

  <line x1="480" y1="566" x2="960" y2="566" stroke="#DFE3DC" stroke-width="1"/>
  <text x="480" y="592" font-size="11" font-weight="700" fill="#9AA8A2" letter-spacing="1.5">THE PRINCIPLE APPLIED</text>
  <text x="480" y="616" font-size="15" font-weight="600" fill="#1A2420">Pick the simplest pattern whose assumptions</text>
  <text x="480" y="638" font-size="15" font-weight="600" fill="#1A2420">match the task's actual properties.</text>
</svg>
