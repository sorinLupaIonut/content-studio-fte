name: Output evals

# The regression gate for what the studio WRITES, as opposed to whether the
# code runs. It reads `evals/golden.json` - frozen answers, already generated -
# so it needs no OpenAI key, no database, no MCP server and no browser. That is
# what lets it run here at all.
#
# WHY THESE PATHS. Only four things can change the writing: the method
# (`skills/`), the prompts that carry it (`generation.py`, `worker.py`,
# `method.py`), the profile the avatar metric grades against, and the eval
# stack itself. A change anywhere else cannot move a score, and running the
# gate on it would teach everyone to ignore the result.
#
# The two path lists are duplicated on purpose: GitHub Actions does not resolve
# YAML anchors, so `&name` / `*name` fails to parse rather than deduplicating.
on:
  pull_request:
    paths:
      - 'skills/**'
      - 'content/profile.md'
      - 'src/content_studio/worker.py'
      - 'src/content_studio/method.py'
      - 'src/content_studio/harness/generation.py'
      - 'evals/**'
      - '.github/workflows/evals.yml'
  push:
    branches: [main, english, deploy]
    paths:
      - 'skills/**'
      - 'content/profile.md'
      - 'src/content_studio/worker.py'
      - 'src/content_studio/method.py'
      - 'src/content_studio/harness/generation.py'
      - 'evals/**'
      - '.github/workflows/evals.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project with the eval extra
        run: uv sync --frozen --extra evals

      # Two layers in one command, and the split is automatic. Without a judge
      # key the three judged metrics SKIP - they never silently pass - while
      # the fingerprint check, the caption arithmetic and the structural tests
      # still run and can still fail the build. Measured on a bare clone with
      # every key unset: 4 passed, 3 skipped, 0.12s.
      #
      # DEEPSEEK_API_KEY is optional. An unset secret arrives as an empty
      # string, which is exactly what `judge_or_none()` treats as "no judge".
      # Add it in Settings > Secrets and the judged layer lights up with no
      # change to this file.
      - name: The gate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # The metrics, the reasons and the skip messages are Romanian; a
          # runner that cannot encode them turns a real result into a
          # UnicodeEncodeError. Ubuntu is UTF-8 already - this is here so the
          # job survives being moved to a Windows runner.
          PYTHONIOENCODING: utf-8
        run: uv run pytest evals/output -q -rs

      # Green above means "no worse than the recorded baseline", never "the
      # writing is good". This prints the open work so nobody reads the tick as
      # a claim about quality.
      - name: What is still open
        if: always()
        env:
          PYTHONIOENCODING: utf-8
        run: |
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import collections
          import json
          import pathlib

          gold = json.loads(
              pathlib.Path("evals/golden.json").read_text(encoding="utf-8")
          )
          base = gold.get("baseline") or {}
          ruler = (base.get("ruler") or {}).get("id", "—")
          print(f"### Referință {base.get('recorded_at')} · riglă `{ruler}`\n")
          print("| metrică | medie | peste prag |")
          print("|---|---|---|")
          for name, row in (base.get("metrics") or {}).items():
              print(f"| {name} | {row['mean']:.2f} | {row['passed']}/{row['n']} |")
          under = collections.Counter(o["metric"] for o in gold.get("open") or [])
          print(f"\n{sum(under.values())} perechi (caz, metrică) sub prag: {dict(under)}")
          PY
