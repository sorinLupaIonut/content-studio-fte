name: CI

# PAUSED ON 2026-08-28, BY REQUEST. Nothing runs on its own any more - only the
# button in the Actions tab. To bring it back, restore the two lines kept below
# under `on:`; nothing else about this file has to change.
#
# Why it was paused rather than deleted: it was failing on every push and mailing
# a failure for each one, and it was right to fail twice over.
#
#   1. The last step read `evals/cases.json`, removed while the eval suite moved
#      to Phoenix. A step that reads a deleted file cannot pass; it is gone now.
#   2. Four "unit" tests opened a real E2B container. CI has no key, so all four
#      errored there - while locally they passed AND quietly spent sandbox
#      minutes, because `.env` has the key. Fixed in
#      `tests/unit/test_failed_runs_are_metered.py`; the suite now runs in 3.9s
#      with no key and no network, against 32s before.
#
# So the mail was not noise: it was reporting a real fault the whole time, and
# both halves are repaired. What stays paused is the schedule, not the checks -
# they run locally, per AGENTS.md § Before you commit.
on:
  # push:
  #   branches: [main, english]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      # No secrets are set for this job on purpose: a unit test that needs a key
      # is not a unit test, and this is the only place that keeps it honest.
      - name: Unit tests
        run: uv run python -m unittest discover -s tests/unit -v
